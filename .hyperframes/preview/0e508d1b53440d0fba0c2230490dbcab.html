    <title>Massimo Vignelli Video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>body,
      html {
        margin: 0;
        padding: 0;
        background: #ffffff;
        overflow: hidden;
        width: 1080px;
        height: 1920px;
        font-family: "Helvetica", Arial, sans-serif;
      }

      /* 6-Column Grid System */
      .grid-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        pointer-events: none;
        z-index: 1000;
        opacity: 0; /* Keep grid invisible but present for layout references */
      }

      .grid-column {
        border-right: 1px solid rgba(204, 0, 0, 0.2); /* Vignelli Red accent */
      }

      #main-composition {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: #ffffff;
        overflow: hidden;
      }

      /* Layer Hosts */
      #a-roll-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        overflow: hidden;
      }

      #a-roll,
      #a-roll-wrapper img.__render_frame__,
      #a-roll-wrapper img.__preview_render_frame__ {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #overlays-comp,
      #captions-comp {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }

      #overlays-comp {
        z-index: 20;
      }

      #captions-comp {
        z-index: 30;
      }

      /* Curtain Transition Layer */
      .curtain {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1a1a1a;
        z-index: 25;
        pointer-events: none;
      }

      .curtain.red {
        background: #cc0000;
        z-index: 26;
      }</style><style data-hf-scene="overlays">* { box-sizing: border-box; margin: 0; padding: 0; }
    [data-composition-id="overlays"]:not(:has([data-hf-inner-root])), [data-composition-id="overlays"] > [data-hf-inner-root] {
      width: 1080px;
      height: 1920px;
      background-color: #030303;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      margin: 0;
    }

    [data-composition-id="overlays"] .composition-root {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    /* Dynamic Grid & Particle Background */
    [data-composition-id="overlays"] .bg-grid {
      position: absolute;
      width: 200%;
      height: 200%;
      background-size: 90px 90px;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 204, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 204, 0.12) 1px, transparent 1px);
      transform-origin: center;
    }

    [data-composition-id="overlays"] .glow-orb {
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(0, 255, 204, 0.4) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      filter: blur(40px);
    }

    /* Container Structure */
    [data-composition-id="overlays"] .viewport {
      position: relative;
      z-index: 10;
      width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
    }

    /* Animated Badge */
    [data-composition-id="overlays"] .badge {
      padding: 14px 36px;
      background: rgba(0, 255, 204, 0.1);
      border: 2px solid #00ffcc;
      border-radius: 100px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #00ffcc;
      text-transform: uppercase;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
    }

    /* Icon Frame */
    [data-composition-id="overlays"] .icon-wrapper {
      width: 180px;
      height: 180px;
      background: rgba(10, 10, 10, 0.9);
      border: 4px solid #00ffcc;
      border-radius: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 60px rgba(0, 255, 204, 0.6);
    }
    [data-composition-id="overlays"] .icon-wrapper svg { width: 100px; height: 100px; fill: #00ffcc; }

    /* Main Title */
    [data-composition-id="overlays"] .hero-title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.05;
      text-align: center;
      letter-spacing: -3px;
      text-transform: uppercase;
    }
    [data-composition-id="overlays"] .hero-title .highlight {
      color: #00ffcc;
      text-shadow: 0 0 40px rgba(0, 255, 204, 0.9);
      display: block;
    }

    /* Kinetic Subtitles (Captions) */
    [data-composition-id="overlays"] .caption-container {
      width: 100%;
      min-height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    [data-composition-id="overlays"] .caption-card {
      background: rgba(15, 15, 15, 0.95);
      border-left: 10px solid #00ffcc;
      border-right: 2px solid rgba(0, 255, 204, 0.3);
      padding: 30px 40px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
    }
    [data-composition-id="overlays"] .caption-text {
      font-size: 48px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
    }
    [data-composition-id="overlays"] .caption-text span {
      color: #00ffcc;
      text-decoration: underline;
    }</style><style data-hf-scene="captions">[data-composition-id="captions"]:not(:has([data-hf-inner-root])), [data-composition-id="captions"] > [data-hf-inner-root] {

        text-transform: uppercase;

      [data-composition-id="captions"] #captions-container {
        position: absolute;

      [data-composition-id="captions"] .caption-group {
        position: absolute;

        justify-content: center;

        z-index: 10;
