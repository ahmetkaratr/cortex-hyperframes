<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1920px;
      background-color: #080808;
      color: #ffffff;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Arka Plan Izgara Efekti */
    .bg-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-size: 60px 60px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      z-index: 1;
    }

    .glow-circle {
      position: absolute;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(0, 255, 204, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    /* Ana İçerik Kapsayıcısı */
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      width: 900px;
    }

    /* Vurgu İkon Kutusu */
    .icon-box {
      width: 150px;
      height: 150px;
      background: rgba(0, 255, 204, 0.1);
      border: 3px solid #00ffcc;
      border-radius: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 50px rgba(0, 255, 204, 0.35);
      animation: pulse 2s infinite ease-in-out;
    }

    .icon-box svg {
      width: 80px;
      height: 80px;
      fill: #00ffcc;
    }

    /* Başlık Kartı */
    .card {
      width: 100%;
      padding: 65px 45px;
      border: 2px solid rgba(0, 255, 204, 0.3);
      border-radius: 36px;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(20px);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    }

    .tag {
      display: inline-block;
      padding: 12px 30px;
      background: rgba(0, 255, 204, 0.15);
      color: #00ffcc;
      border-radius: 100px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 30px;
      text-transform: uppercase;
      border: 1px solid rgba(0, 255, 204, 0.4);
    }

    .main-title {
      font-size: 76px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -2px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .main-title span {
      color: #00ffcc;
      text-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
    }

    /* CapCut Uyumlu Altyazı Alanı */
    .caption-box {
      margin-top: 10px;
      width: 100%;
      text-align: center;
    }

    .subtitle-text {
      font-size: 46px;
      font-weight: 700;
      color: #f0f0f0;
      line-height: 1.4;
      background: rgba(12, 12, 12, 0.85);
      padding: 24px 32px;
      border-radius: 24px;
      border-left: 6px solid #00ffcc;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 35px rgba(0, 255, 204, 0.3); }
      50% { transform: scale(1.06); box-shadow: 0 0 65px rgba(0, 255, 204, 0.6); }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-circle"></div>

  <div class="container">
    <!-- Matrix / Farkındalık İkonu -->
    <div class="icon-box">
      <svg viewBox="0 0 24 24">
        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
      </svg>
    </div>

    <!-- Ana Kart ve Başlık -->
    <div class="card">
      <div class="tag">CORTEX MATRIX #02</div>
      <h1 class="main-title">SESSİZ KİTLE <span>İLLÜZYONU</span></h1>
    </div>

    <!-- Seslendirmeye Denk Gelecek Altyazı -->
    <div class="caption-box">
      <p class="subtitle-text">"Çoğunluğun izinden gitmek bir güvenlik değil, kaybolma biçimidir."</p>
    </div>
  </div>
</body>
</html>
