<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      background-color: #030303;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      margin: 0;
    }

    .composition-root {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    /* Dynamic Grid & Particle Background */
    .bg-grid {
      position: absolute;
      width: 200%;
      height: 200%;
      background-size: 90px 90px;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 204, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 204, 0.12) 1px, transparent 1px);
      transform-origin: center;
    }

    .glow-orb {
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(0, 255, 204, 0.4) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      filter: blur(40px);
    }

    /* Container Structure */
    .viewport {
      position: relative;
      z-index: 10;
      width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
    }

    /* Animated Badge */
    .badge {
      padding: 14px 36px;
      background: rgba(0, 255, 204, 0.1);
      border: 2px solid #00ffcc;
      border-radius: 100px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #00ffcc;
      text-transform: uppercase;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
    }

    /* Icon Frame */
    .icon-wrapper {
      width: 180px;
      height: 180px;
      background: rgba(10, 10, 10, 0.9);
      border: 4px solid #00ffcc;
      border-radius: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 60px rgba(0, 255, 204, 0.6);
    }
    .icon-wrapper svg { width: 100px; height: 100px; fill: #00ffcc; }

    /* Main Title */
    .hero-title {
      font-size: 92px;
      font-weight: 900;
      line-height: 1.05;
      text-align: center;
      letter-spacing: -3px;
      text-transform: uppercase;
    }
    .hero-title .highlight {
      color: #00ffcc;
      text-shadow: 0 0 40px rgba(0, 255, 204, 0.9);
      display: block;
    }

    /* Kinetic Subtitles (Captions) */
    .caption-container {
      width: 100%;
      min-height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .caption-card {
      background: rgba(15, 15, 15, 0.95);
      border-left: 10px solid #00ffcc;
      border-right: 2px solid rgba(0, 255, 204, 0.3);
      padding: 30px 40px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
    }
    .caption-text {
      font-size: 48px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
    }
    .caption-text span {
      color: #00ffcc;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="composition-root" data-composition-id="overlays" data-width="1080" data-height="1920">
    <div class="bg-grid" id="bgGrid"></div>
    <div class="glow-orb" id="glowOrb"></div>

    <div class="viewport">
      <div class="badge" id="badge">CORTEX MATRIX #02</div>
      
      <div class="icon-wrapper" id="iconBox">
        <svg viewBox="0 0 24 24">
          <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
        </svg>
      </div>

      <h1 class="hero-title" id="heroTitle">
        SESSİZ KİTLE <span class="highlight">İLLÜZYONU</span>
      </h1>

      <div class="caption-container">
        <div class="caption-card" id="captionCard">
          <p class="caption-text" id="captionText">"Çoğunluğun izinden gitmek güvenlik değil..."</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Elements
    const bgGrid = document.getElementById('bgGrid');
    const glowOrb = document.getElementById('glowOrb');
    const badge = document.getElementById('badge');
    const iconBox = document.getElementById('iconBox');
    const heroTitle = document.getElementById('heroTitle');
    const captionCard = document.getElementById('captionCard');
    const captionText = document.getElementById('captionText');

    // 15 Second Timeline Animation Loop
    // Phase 1: Intro Hit (0s - 3s)
    iconBox.animate([
      { transform: 'scale(0) rotate(-180deg)', opacity: 0 },
      { transform: 'scale(1.2) rotate(10deg)', opacity: 1, offset: 0.7 },
      { transform: 'scale(1) rotate(0deg)', opacity: 1 }
    ], { duration: 1000, easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)', fill: 'forwards' });

    heroTitle.animate([
      { transform: 'translateY(120px) scale(0.8)', opacity: 0 },
      { transform: 'translateY(0) scale(1)', opacity: 1 }
    ], { duration: 900, delay: 300, easing: 'ease-out', fill: 'forwards' });

    badge.animate([
      { transform: 'translateY(-50px)', opacity: 0 },
      { transform: 'translateY(0)', opacity: 1 }
    ], { duration: 600, delay: 100, fill: 'forwards' });

    // Background Continuous Rotation & Glow Pulse
    bgGrid.animate([
      { transform: 'rotate(0deg) scale(1)' },
      { transform: 'rotate(180deg) scale(1.3)' },
      { transform: 'rotate(360deg) scale(1)' }
    ], { duration: 15000, iterations: Infinity, easing: 'linear' });

    glowOrb.animate([
      { transform: 'scale(0.8)', opacity: 0.3 },
      { transform: 'scale(1.4)', opacity: 0.8 },
      { transform: 'scale(0.8)', opacity: 0.3 }
    ], { duration: 4000, iterations: Infinity, easing: 'ease-in-out' });

    // Phase 2: Dynamic Caption Sequence (03s - 15s)
    setTimeout(() => {
      captionCard.animate([
        { transform: 'scale(0.9)', opacity: 0.5 },
        { transform: 'scale(1.05)', opacity: 1 },
        { transform: 'scale(1)', opacity: 1 }
      ], { duration: 400 });
      captionText.innerHTML = "Çoğunluğun izinden gitmek <span>GÜVENLİK</span> değildir.";
    }, 3500);

    setTimeout(() => {
      captionCard.animate([
        { transform: 'translateY(20px)', opacity: 0 },
        { transform: 'translateY(0)', opacity: 1 }
      ], { duration: 400 });
      captionText.innerHTML = "Bu sadece kendi yolunu <span>KAYBETME BİÇİMİDİR</span>.";
    }, 7500);

    setTimeout(() => {
      captionCard.animate([
        { transform: 'scale(1.2)', opacity: 1 },
        { transform: 'scale(1)', opacity: 1 }
      ], { duration: 500 });
      captionText.innerHTML = "Sistem seni uykuda tutar. <span>UYAN.</span>";
    }, 11500);
  </script>
</body>
</html>
